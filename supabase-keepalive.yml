name: Supabase Keep Alive

on:
  schedule:
    # Supabase dreimal täglich aktiv halten
    - cron: "15 5,12,19 * * *"

    # GitHub-Repository einmal pro Woche aktiv halten
    - cron: "0 8 * * 0"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create Supabase database activity
        run: |
          BASE_URL="${{ secrets.SUPABASE_URL }}"
          BASE_URL="${BASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"
          ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

          for i in 1 2 3
          do
            NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            ID=$(date +%s%N)

            SUCCESS=false

            for attempt in 1 2 3
            do
              echo "Supabase request $i - attempt $attempt"

              RESPONSE=$(curl \
                --connect-timeout 15 \
                --max-time 30 \
                -s \
                -w "\nHTTP_STATUS:%{http_code}" \
                -X POST "$BASE_URL/rest/v1/keepalive_log" \
                -H "apikey: $ANON_KEY" \
                -H "Authorization: Bearer $ANON_KEY" \
                -H "Content-Type: application/json" \
                -H "Prefer: return=representation" \
                -d "{\"id\":$ID,\"created_at\":\"$NOW\"}")

              echo "$RESPONSE"

              HTTP_STATUS=$(echo "$RESPONSE" | sed -n 's/^HTTP_STATUS://p')

              if [ "$HTTP_STATUS" = "201" ]; then
                echo "Supabase insert successful."
                SUCCESS=true
                break
              fi

              if [ "$attempt" = "1" ]; then
                echo "Request failed with HTTP $HTTP_STATUS. Retrying in 30 seconds..."
                sleep 30
              elif [ "$attempt" = "2" ]; then
                echo "Request failed with HTTP $HTTP_STATUS. Retrying in 60 seconds..."
                sleep 60
              fi
            done

            if [ "$SUCCESS" != "true" ]; then
              echo "Supabase request failed after 3 attempts."
              exit 1
            fi

            curl \
              --connect-timeout 15 \
              --max-time 30 \
              -s \
              "$BASE_URL/rest/v1/keepalive_log?select=id,created_at&order=created_at.desc&limit=1" \
              -H "apikey: $ANON_KEY" \
              -H "Authorization: Bearer $ANON_KEY" \
              > /dev/null

            sleep 5
          done

      - name: Keep GitHub repository active
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * 0'
        run: |
          date -u +"Last automatic GitHub activity: %Y-%m-%d %H:%M:%S UTC" > github-keepalive.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-keepalive.txt
          git commit -m "Weekly repository keepalive"
          git push origin HEAD:main
